<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
  <!-- MyView brand logo: green/red candlestick mark + gold wordmark.
       Colors match the dashboard theme: up #089981, down #f23645, accent #f0b90b. -->
  <g>
    <!-- green (up) candle -->
    <line x1="40" y1="10" x2="40" y2="34" stroke="#089981" stroke-width="8" stroke-linecap="round" />
    <rect x="20" y="34" width="40" height="48" rx="6" fill="#089981" />
    <line x1="40" y1="82" x2="40" y2="110" stroke="#089981" stroke-width="8" stroke-linecap="round" />
    <!-- red (down) candle -->
    <line x1="88" y1="30" x2="88" y2="54" stroke="#f23645" stroke-width="8" stroke-linecap="round" />
    <rect x="68" y="54" width="40" height="48" rx="6" fill="#f23645" />
    <line x1="88" y1="102" x2="88" y2="118" stroke="#f23645" stroke-width="8" stroke-linecap="round" />
  </g>
  <text x="140" y="82" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#f0b90b" letter-spacing="1">MyView</text>
</svg>