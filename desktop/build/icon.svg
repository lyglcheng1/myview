<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b28"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#0ecb81" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ecb81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14e391"/>
      <stop offset="1" stop-color="#0aa668"/>
    </linearGradient>
    <linearGradient id="redBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b7d"/>
      <stop offset="1" stop-color="#d63b52"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background: dark rounded square (matches the dark watch theme) -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#232b3c" stroke-width="3"/>

  <!-- Faint chart grid -->
  <g stroke="#1a2231" stroke-width="2">
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="80" y1="372" x2="432" y2="372"/>
    <line x1="160" y1="88" x2="160" y2="424"/>
    <line x1="256" y1="88" x2="256" y2="424"/>
    <line x1="352" y1="88" x2="352" y2="424"/>
  </g>

  <!-- Soft green glow behind the candles -->
  <circle cx="256" cy="290" r="220" fill="url(#glow)"/>

  <!-- "V" trend line connecting the candle extremes (the Vela V) -->
  <polyline points="96,150 256,420 416,150" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Candlestick "V": left side red (down), right side green (up), reversal at the tip -->
  <g filter="url(#shadow)">
    <!-- c1 red -->
    <line x1="96" y1="150" x2="96" y2="310" stroke="#f6465d" stroke-width="8" stroke-linecap="round"/>
    <rect x="74" y="190" width="44" height="78" rx="10" fill="url(#redBody)"/>
    <!-- c2 red -->
    <line x1="176" y1="204" x2="176" y2="362" stroke="#f6465d" stroke-width="8" stroke-linecap="round"/>
    <rect x="154" y="244" width="44" height="78" rx="10" fill="url(#redBody)"/>
    <!-- c3 green tip (reversal) -->
    <line x1="256" y1="258" x2="256" y2="420" stroke="#0ecb81" stroke-width="8" stroke-linecap="round"/>
    <rect x="234" y="298" width="44" height="78" rx="10" fill="url(#greenBody)"/>
    <!-- c4 green -->
    <line x1="336" y1="204" x2="336" y2="362" stroke="#0ecb81" stroke-width="8" stroke-linecap="round"/>
    <rect x="314" y="244" width="44" height="78" rx="10" fill="url(#greenBody)"/>
    <!-- c5 green -->
    <line x1="416" y1="150" x2="416" y2="310" stroke="#0ecb81" stroke-width="8" stroke-linecap="round"/>
    <rect x="394" y="190" width="44" height="78" rx="10" fill="url(#greenBody)"/>
  </g>
</svg>